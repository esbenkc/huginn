<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tick 0</title>
</head>
<body>
<p id="clock">0</p>
<script>
  let ticks = 0;
  setInterval(() => {
    ticks++;
    document.title = 'tick ' + ticks;
    document.getElementById('clock').textContent = String(ticks);
  }, 100);
</script>
</body>
</html>
