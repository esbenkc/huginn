<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>live</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  .at { position: absolute; left: 10px; }
  #btn { top: 10px; width: 120px; height: 30px; }
  #pd { top: 50px; display: block; width: 200px; height: 20px; }
  #hov { top: 80px; width: 100px; height: 30px; background: rgb(255, 0, 0); }
  #hov:hover { background: rgb(0, 128, 0); }
  #out { top: 120px; }
</style>
</head>
<body>
<button id="btn" class="at">Add</button>
<a id="pd" class="at" href="b.html">Prevented link</a>
<div id="hov" class="at"></div>
<div id="out" class="at"></div>
<script>
  let n = 0;
  document.getElementById('btn').addEventListener('click', (e) => {
    n++;
    const p = document.createElement('p');
    p.textContent = 'item ' + n;
    document.getElementById('out').appendChild(p);
    document.title = 'clicked ' + n + ' ' + e.isTrusted + ' ' + e.clientX + ',' + e.clientY;
  });
  document.getElementById('pd').addEventListener('click', (e) => {
    e.preventDefault();
    document.title = 'prevented';
  });
  document.getElementById('hov').addEventListener('mouseenter', () => { document.title = 'entered'; });
</script>
</body>
</html>
