[package]
name = "huginn-net"
description = "Fetching (http, https, file, data), cache, resource decoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["avif"]
# AVIF images. Without it, image requests do not advertise image/avif.
avif = ["dep:avif-parse", "dep:rav1d"]

[dependencies]
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
url.workspace = true
data-url.workspace = true
psl.workspace = true
parking_lot.workspace = true
image.workspace = true
vello_common.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
brotli-decompressor.workspace = true
wuff.workspace = true
resvg.workspace = true
avif-parse = { workspace = true, optional = true }
rav1d = { workspace = true, optional = true }

[dev-dependencies]
# Test servers for HTTP/2 and HTTP/1.1 over TLS (transport.rs).
hyper = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["macros"] }
