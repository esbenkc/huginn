[package]
name = "huginn-net"
description = "Fetching (http, https, file, data), cache, resource decoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["avif"]
# AVIF images. Without it, image requests do not advertise image/avif.
avif = ["dep:avif-parse", "dep:rav1d"]

[dependencies]
ureq.workspace = true
url.workspace = true
data-url.workspace = true
psl.workspace = true
parking_lot.workspace = true
image.workspace = true
vello_common.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
brotli-decompressor.workspace = true
wuff.workspace = true
resvg.workspace = true
avif-parse = { workspace = true, optional = true }
rav1d = { workspace = true, optional = true }
