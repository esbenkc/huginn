[package]
name = "huginn-js"
description = "JavaScript engine: V8 bindings for the Huginn DOM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Link V8 (the `v8` crate). Its build downloads a prebuilt static library
# (~40 MB); without the feature Huginn runs no scripts. The build script
# links V8 too: it runs the prelude into a startup snapshot (build.rs).
v8 = ["dep:v8", "dep:encoding_rs", "dep:flate2", "dep:parking_lot"]

[dependencies]
huginn-dom.workspace = true
huginn-net.workspace = true
huginn-style.workspace = true
url.workspace = true
v8 = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[build-dependencies]
v8 = { workspace = true, optional = true }
