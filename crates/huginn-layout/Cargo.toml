[package]
name = "huginn-layout"
description = "Box tree construction and layout (Taffy + Parley)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
huginn-dom.workspace = true
huginn-style.workspace = true
huginn-net.workspace = true
taffy.workspace = true
parley.workspace = true
markup5ever.workspace = true

# Linux: load libfontconfig at run time (dlopen), so the build does not need
# the fontconfig development package. Same fontique that parley uses.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.12.0", default-features = false, features = ["fontconfig-dlopen"] }
