<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Boxes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eceff1; font-family: Helvetica, Arial, sans-serif; }
  header { background: linear-gradient(#000, #fff); background-color: #37474f; color: white; padding: 20px 32px; }
  main { max-width: 900px; margin: 24px auto; background: white; padding: 24px; border: 1px solid #cfd8dc; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .tile { width: calc(33.333% - 11px); height: 100px; border: 3px solid #455a64; padding: 10px; }
  .t1 { background: #ffcdd2; border-color: #c62828; }
  .t2 { background: #c8e6c9; border-radius: 16px; border-color: #2e7d32; }
  .t3 { background: #bbdefb; border-style: dashed; }
  .t4 { background: #fff9c4; border-width: 1px 6px; }
  .t5 { background: #e1bee7; opacity: 0.5; }
  .t6 { background: #ffe0b2; border: none; border-bottom: 6px solid #ef6c00; }
  .half { width: 50%; background: #455a64; color: white; padding: 12px; margin-top: 20px; }
  .pill { display: inline-block; background: #1e88e5; color: white; padding: 4px 12px; border-radius: 999px; margin-right: 6px; }
  hr { margin: 24px 0; }
  .abs-wrap { position: relative; height: 80px; background: #f5f5f5; margin-top: 20px; }
  .abs { position: absolute; right: 10px; top: 10px; width: 120px; height: 60px; background: #8d6e63; color: white; padding: 8px; }
</style>
</head>
<body>
  <header><h1 style="margin:0">Box model</h1></header>
  <main>
    <div class="grid">
      <div class="tile t1">solid red</div>
      <div class="tile t2">rounded</div>
      <div class="tile t3">dashed</div>
      <div class="tile t4">uneven widths</div>
      <div class="tile t5">opacity 0.5</div>
      <div class="tile t6">bottom only</div>
    </div>
    <div class="half">50% wide box</div>
    <hr>
    <p><span class="pill">alpha</span><span class="pill">beta</span><span class="pill">gamma</span></p>
    <div class="abs-wrap">relative container<div class="abs">absolute</div></div>
  </main>
</body>
</html>
