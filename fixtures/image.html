<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Images</title>
<link rel="stylesheet" href="assets/image.css">
</head>
<body>
  <h1>Images</h1>
  <p>An inline image <img src="assets/photo.png" alt="photo"> sits on the text baseline.</p>
  <img class="wide" src="assets/photo.png" alt="wide photo">
  <div class="tiled">A box with a tiled background image.</div>
  <div class="row">
    <img src="assets/photo.png" width="60" height="40" alt="small">
    <img src="assets/photo.png" style="width: 180px" alt="medium">
    <img src="assets/missing.png" alt="missing">
  </div>
</body>
</html>
