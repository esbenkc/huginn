<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AVIF images</title>
<style>
  body { margin: 0; background: #808080; }
  img { position: absolute; top: 100px; width: 64px; height: 32px; }
</style>
</head>
<body>
  <h1>AVIF images</h1>
  <!-- Each file is 32x16: left half red, right half blue. Drawn at 64x32. -->
  <!-- 8-bit 4:2:0, BT.601, full range. -->
  <img src="assets/redblue-420.avif" style="left: 0">
  <!-- 10-bit 4:4:4. -->
  <img src="assets/redblue-10bit.avif" style="left: 100px">
  <!-- 8-bit 4:2:0, BT.709, limited range, at its natural size (32x16). -->
  <img src="assets/redblue-709-limited.avif" style="left: 200px; width: auto; height: auto">
  <!-- Alpha: left half green; right half red at alpha 128 (top) and transparent (bottom). -->
  <img src="assets/alpha.avif" style="left: 300px">
  <!-- Lossless (identity matrix) as a CSS background. -->
  <div style="position: absolute; left: 400px; top: 100px; width: 64px; height: 32px;
              background: url(assets/redblue-lossless.avif) 0 0 / 64px 32px"></div>
</body>
</html>
