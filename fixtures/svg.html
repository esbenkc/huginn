<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG</title>
<style>
  body { margin: 0; color: #ff0000; }
  .box { position: absolute; top: 100px; width: 50px; height: 50px; }
  #inline { left: 100px; }
  #img { left: 300px; }
  #bg { left: 500px; background-image: url(assets/green.svg); background-repeat: no-repeat; }
  #inline svg { width: 50px; height: 50px; }
</style>
</head>
<body>
  <h1 style="color: black">Inline SVG, SVG image, SVG background</h1>
  <div class="box" id="inline"><svg viewBox="0 0 2 2"><rect width="2" height="2" fill="currentColor"/></svg></div>
  <div class="box" id="img"><img src="assets/blue.svg" width="50" height="50" alt="blue"></div>
  <div class="box" id="bg"></div>
  <img id="wide" src="assets/wide.svg" width="40" height="10" style="position: absolute; left: 0; top: 200px; width: auto; height: 20px" alt="wide">
  <svg style="display: none"><rect width="99" height="99"/></svg>
</body>
</html>
